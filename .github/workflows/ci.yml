name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ctp: openctp-ctp==6.7.11.0
          - os: windows-latest
            ctp: openctp-ctp==6.7.11.0
          - os: macos-latest
            ctp: openctp-ctp==6.7.7.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Build zh_CN.GB18030 locale (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo localedef -i zh_CN -f GB18030 --no-archive /usr/lib/locale/zh_CN.GB18030 || true
          mkdir -p .runtime/locale
          localedef -i zh_CN -f GB18030 --no-archive .runtime/locale/zh_CN.GB18030
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.12.0 ${{ matrix.ctp }}
      - name: Run tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
      - name: Native check
        run: python src/main.py --diagnostics diagnostics.json --native-check
        env:
          PYTHONPATH: src

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Build zh_CN.GB18030 locale
        run: |
          sudo localedef -i zh_CN -f GB18030 --no-archive /usr/lib/locale/zh_CN.GB18030 || true
          mkdir -p .runtime/locale
          localedef -i zh_CN -f GB18030 --no-archive .runtime/locale/zh_CN.GB18030
          localedef -i zh_CN -f GB18030 --no-archive packaging/pyinstaller/locale/zh_CN.GB18030
          sudo chmod -R a+rX packaging/pyinstaller/locale
      - name: Install dependencies
        run: |
          pip install -r requirements-desktop.txt pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm \
            --distpath build/pyinstaller/dist \
            --workpath build/pyinstaller/work \
            packaging/pyinstaller/PyTrade.spec
      - name: Verify bundle
        run: |
          build/pyinstaller/dist/PyTrade/PyTrade --diagnostics bundle-diagnostics.json --native-check
          build/pyinstaller/dist/PyTrade/PyTrade --smoke-test --screenshot shots/
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package tar.gz
        run: |
          cd build/pyinstaller/dist
          tar czf ../../../pytrade-linux-x64.tar.gz PyTrade
      - uses: actions/upload-artifact@v4
        with:
          name: pytrade-linux-x64
          path: pytrade-linux-x64.tar.gz

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements-windows.lock pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --distpath build/pyinstaller/dist --workpath build/pyinstaller/work packaging/pyinstaller/PyTrade.spec
      - name: Verify bundle
        run: |
          $exe = (Resolve-Path build/pyinstaller/dist/PyTrade/PyTrade.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--diagnostics', 'bundle-diagnostics.json', '--native-check' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Native check failed: $($process.ExitCode)" }
          if (!(Test-Path bundle-diagnostics.json)) { throw 'Native diagnostics missing' }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', '--screenshot', 'shots/' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "GUI smoke failed: $($process.ExitCode)" }
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package zip
        run: |
          Compress-Archive -Path build/pyinstaller/dist/PyTrade -DestinationPath pytrade-windows-x64.zip
      - name: Verify extracted zip
        run: |
          Expand-Archive -Path pytrade-windows-x64.zip -DestinationPath build/zip-check
          $exe = (Resolve-Path build/zip-check/PyTrade/PyTrade.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList '--diagnostics', 'zip-diagnostics.json', '--native-check' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Extracted native check failed: $($process.ExitCode)" }
          if (!(Test-Path zip-diagnostics.json)) { throw 'Extracted diagnostics missing' }
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', '--screenshot', 'zip-shots/' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Extracted GUI smoke failed: $($process.ExitCode)" }
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v4
        with:
          name: pytrade-windows-x64
          path: pytrade-windows-x64.zip
          if-no-files-found: error

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install PySide6==6.12.0 openctp-ctp==6.7.7.1 pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --distpath build/pyinstaller/dist --workpath build/pyinstaller/work packaging/pyinstaller/PyTrade.spec
      - name: Verify bundle
        run: |
          build/pyinstaller/dist/PyTrade/PyTrade --diagnostics bundle-diagnostics.json --native-check
          build/pyinstaller/dist/PyTrade/PyTrade --smoke-test --screenshot shots/
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Package tar.gz
        run: |
          cd build/pyinstaller/dist
          tar czf ../../../pytrade-macos-arm64.tar.gz PyTrade
      - uses: actions/upload-artifact@v4
        with:
          name: pytrade-macos-arm64
          path: pytrade-macos-arm64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pytrade-linux-x64/pytrade-linux-x64.tar.gz
            artifacts/pytrade-windows-x64/pytrade-windows-x64.zip
            artifacts/pytrade-macos-arm64/pytrade-macos-arm64.tar.gz
          generate_release_notes: true
